[book]
authors = ["Alistair Keiller"]
language = "en"
src = "src"
title = "Ray March Lab (Warp)"

[output.html]
additional-css = ["theme/css/custom.css"]
additional-js = ["theme/solution.js"]
default-theme = "light"
preferred-dark-theme = "ayu"
smart-punctuation = true
no-section-label = true
git-repository-url = "https://github.com/AlistairKeiller/ray_march_lab_warp"
mathjax-support = true

[output.html.fold]
enable = false

[build]
build-dir = "html"
create-missing = false
